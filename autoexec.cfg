// ============================
// STARTOPTIONEN (Steam -> Rechtsklick CS2 -> Eigenschaften -> Startoptionen)
// ============================
// -novid -nojoy -high -freq 280 +exec autoexec

// ============================
// VIDEO SETTINGS (manuell im Spielmenü gesetzt, nicht per Konsole steuerbar)
// ============================
// Global Shadow Quality:           High
// Dynamic Shadows:                 All
// Model / Texture Detail:          High
// Texture Filtering Mode:          Anisotropic 16x
// Shader Detail:                   High
// Particle Detail:                 High
// Ambient Occlusion:               High
// High Dynamic Range:              Quality
// Multisampling Anti-Aliasing:     16x MSAA
// FidelityFX Super Resolution:     Disabled (Highest Quality)
// Boost Player Contrast:           Enabled
// V-Sync:                          Disabled
// AMD Anti-Lag 2.0:                Enabled
// Maximum FPS In Game:             300
// Maximum FPS In Menus:            200
// Display Mode:                    Fullscreen
// Resolution:                      2560x1440 @ 280Hz

// ============================
// PERFORMANCE
// ============================
fps_max "300"
// fps_max_menu "200" // kein gueltiger Konsolenbefehl in CS2, manuell im Video-Menue unter "Maximum FPS In Menus" setzen

// ============================
// BINDS - Movement
// ============================
bind "w" "+forward"
bind "a" "+left"
bind "s" "+back"
bind "d" "+right"
bind "SPACE" "+jump"
bind "CTRL" "+duck"
bind "SHIFT" "+sprint"

// ============================
// BINDS - Weapon Slots
// ============================
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "0" "slot10"

// ============================
// BINDS - Grenades
// ============================
bind "c" "slot6" // hegrenade
bind "v" "slot7" // flashbang
bind "ALT" "slot8" // smokegrenade
bind "x" "slot10" // molotov

// ============================
// BINDS - Actions
// ============================
bind "e" "+use"
bind "f" "+lookatweapon"
bind "g" "drop"
bind "r" "+reload"
bind "q" "switchhands"

// ============================
// BINDS - Buy
// ============================
bind "b" "buymenu"
bind "END" "rebuy"
bind "DEL" "say get leetify"

// ============================
// BINDS - Communication
// ============================
bind "t" "messagemode"
bind "y" "messagemode2"
bind "o" "playerradio deathcry kappa"

// ============================
// BINDS - Mouse
// ============================
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MOUSE4" "player_ping"
bind "MOUSE5" "+voicerecord"
bind "MWHEELUP" "invprev"
bind "MWHEELDOWN" "invnext"

// ============================
// BINDS - Interface / Misc
// ============================
bind "TAB" "+showscores"
bind "ESCAPE" "cancelselect"
bind "\" "toggleconsole"
bind "h" "toggle gameinstructor_enable"
bind "j" "noclip"
bind "u" "demoui"

// ============================
// CROSSHAIR (Stand: CS2 Crosshair-Update Sept. 2026)
// Farbe (Gruen) wird manuell im Crosshair-Menue gesetzt - cl_crosshaircolor_r/g/b/a
// laufen zwar fehlerfrei durch, greifen aber nicht sichtbar, daher hier entfernt.
// ============================
cl_crosshairstyle 4
cl_crosshair_length 8
cl_crosshair_thickness 3
cl_crosshair_gap 4
cl_crosshairdot 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshair_t 0
cl_crosshair_sniper_width 1
cl_crosshair_friendly_warning 1
cl_crosshair_dynamic_splitdist 5
cl_crosshair_dynamic_maxdist_splitratio 0
cl_crosshair_dynamic_splitalpha_innermod 1
cl_crosshair_dynamic_splitalpha_outermod 0.3

// ============================
// HUD (Farbe 8 = Gelb)
// ============================
cl_hud_color 8
hud_showtargetid 1
// r_drawviewmodel 1 // cheat-protected in aktueller CS2-Version, Befehl wird ignoriert; Viewmodel ist per Default eh an
cl_hud_telemetry_frametime_show "2"
cl_hud_telemetry_frametime_poor "10.0"
cl_hud_telemetry_ping_show "2"
cl_hud_telemetry_ping_poor "50.0"
cl_hud_telemetry_net_misdelivery_show "2"
cl_hud_telemetry_net_misdelivery_poor "5.0"

// ============================
// RADAR
// ============================
cl_radar_always_centered "0"
cl_radar_icon_scale_min "0.7"
cl_radar_rotate "1"
cl_radar_scale "0.4"

// ============================
// GAMEPLAY
// ============================
cl_allow_animated_avatars false
cl_showloadout true
r_drawtracers_firstperson false

// ============================
// SENSITIVITY / AUDIO
// ============================
// Windows -> Maus-Einstellungen -> "Zeigergenauigkeit verbessern (Enhance pointer precision)": Off
sensitivity "0.8"  // at 800dpi
volume "0.205"

// ============================
// VIEWMODEL
// ============================
viewmodel_fov 60
viewmodel_offset_x 1
viewmodel_offset_y 1
viewmodel_offset_z -1
viewmodel_presetpos 1
